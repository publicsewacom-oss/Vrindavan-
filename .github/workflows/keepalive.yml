name: keepalive

on:
  schedule:
    - cron: "17 3 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          URL="https://apnbqtsufykowvaqlvmj.supabase.co"
          KEY="sb_publishable_7_YxI2tmS1ZRRwOzen2gWg_-EQXGQlI"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/get_settings" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
            echo "try $i -> HTTP $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 20
          done
          [ "${ok:-0}" = "1" ] || { echo "Supabase ne jawab nahi diya"; exit 1; }
      - name: Ping website
        run: curl -s -o /dev/null -w "website HTTP %{http_code}\n" "https://publicsewacom-oss.github.io/Vrindavan-/"
