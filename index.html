<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vrindavan Food Enterprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#0B4F4A;--teal2:#073B37;--gold:#F5B301;--gold2:#FFE9A8;--bg:#F4F7F5;--ink:#14211F;--mute:#5B6B67;--line:#D9E3DE;--red:#C0392B;--green:#1E8449;--card:#fff}
*{box-sizing:border-box;margin:0}
body{font-family:'Hind',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.brand,.tn,.tbadge{font-family:'Baloo 2','Hind',sans-serif}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.mute{color:var(--mute)}
.demo{background:#FFF3CD;color:#6B4E00;padding:6px 12px;font-size:13px;text-align:center}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}#toast.err{background:var(--red)}

/* buttons */
.btn{display:block;width:100%;padding:13px;border-radius:12px;font-weight:700;font-size:17px;text-align:center;text-decoration:none}
.btn.gold{background:var(--gold);color:var(--teal2)}
.btn.teal{background:var(--teal);color:#fff}
.btn.line{border:2px solid var(--teal);color:var(--teal)}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:15px;border-radius:10px}

/* customer */
.cust{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:110px;background:var(--bg)}
.top{background:var(--teal);color:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:22px;font-weight:700;line-height:1.15}
.sub{color:var(--gold2);font-size:14px}
.tbadge{background:var(--gold);color:var(--teal2);border-radius:14px;padding:6px 14px;text-align:center;line-height:1;flex:none}
.tbadge small{display:block;font-size:12px;font-weight:600;margin-bottom:2px}
.tbadge b{font-size:36px;font-weight:800}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:6px;padding:8px 12px;align-items:center;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:999px;font-weight:600;color:var(--mute)}
.tab.on{background:var(--teal);color:#fff}
.callw{margin-left:auto;background:var(--gold2);border:2px solid var(--gold);color:var(--teal2);border-radius:999px;padding:6px 14px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.menu{list-style:none;padding:0}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:#fff}
.nm{font-weight:600;font-size:17px}
.ds{color:var(--mute);font-size:14px}
.pr{font-weight:700;margin-top:2px}
.ctl{flex:none;text-align:right}
.na{font-size:13px;color:var(--red)}
.dot{display:inline-block;width:14px;height:14px;border:2px solid var(--green);border-radius:3px;margin-right:8px;position:relative;vertical-align:-1px}
.dot::after{content:'';position:absolute;inset:2px;border-radius:50%;background:var(--green)}
.dot.nv{border-color:var(--red)}.dot.nv::after{background:var(--red)}
.add{border:2px solid var(--teal);color:var(--teal);border-radius:10px;padding:5px 22px;font-weight:700}
.step{display:inline-flex;align-items:center;background:var(--teal);color:#fff;border-radius:10px}
.step button{width:36px;height:36px;font-size:20px;color:#fff}
.step span{min-width:24px;text-align:center;font-weight:700}
#cartbar{position:fixed;left:0;right:0;bottom:0;z-index:6}
.cb{max-width:560px;margin:0 auto;background:var(--teal2);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 -4px 16px rgba(0,0,0,.18)}
.cb b{font-size:18px}
.cb .btn{width:auto;padding:10px 20px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fff;border-radius:18px 18px 0 0;z-index:21;max-height:90vh;display:flex;flex-direction:column}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.sh-h h2{font-size:20px}
.sh-h button{font-size:20px;padding:4px 8px}
.sh-b{padding:8px 16px;overflow:auto}
.ln{display:grid;grid-template-columns:1fr auto 64px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lt{text-align:right;font-weight:700}
.fl{display:block;margin-top:14px;font-weight:600}
.fl textarea{width:100%;margin-top:6px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit;resize:none}
.sh-f{padding:12px 16px 16px;border-top:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;font-size:19px;margin-bottom:10px}
.oc{background:#fff;border:1px solid var(--line);border-radius:14px;margin:12px;padding:14px}
.oc h3{font-size:18px;display:flex;justify-content:space-between}
.oc .li{display:flex;justify-content:space-between;color:var(--ink)}
.prog{display:flex;list-style:none;padding:0;margin:12px 0 8px}
.prog li{flex:1;text-align:center;font-size:12px;color:var(--mute);position:relative;padding-top:18px}
.prog li::before{content:'';position:absolute;top:0;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--line)}
.prog li.done{color:var(--teal);font-weight:700}
.prog li.done::before{background:var(--teal)}
.pay{background:#fff;border:2px solid var(--teal);border-radius:14px;margin:12px;padding:14px}
.pay h3{font-size:20px;display:flex;justify-content:space-between;margin-bottom:8px}
.pay .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.upi{text-align:center;margin-top:10px}
#upiqr{display:inline-block;padding:10px;background:#fff;border:1px solid var(--line);border-radius:10px}
.msg{background:#E7F5EC;border:1px solid #BFE3CC;color:#14532D;border-radius:12px;padding:12px;margin:12px}
.empty{text-align:center;padding:40px 20px;color:var(--mute)}
.empty .btn{margin-top:14px;display:inline-block;width:auto;padding:10px 24px}

/* counter */
.cn-top{background:var(--teal2);color:#fff;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px}
.cn-top .brand{font-size:20px;margin-right:8px}
.cn-top .tab{color:#CFE3DF}
.cn-top .tab.on{background:var(--gold);color:var(--teal2)}
.cn-top .sp{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:14px;flex-wrap:wrap}
.cn-top label{display:flex;gap:6px;align-items:center}
.sbtn{border:1.5px solid #5E8F89;border-radius:8px;padding:4px 10px}
.alerts{padding:14px 14px 0}
.alert{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:10px;padding:10px 14px;margin-bottom:8px;font-weight:600}
.alert.waiter{background:var(--red);color:#fff}
.alert.bill{background:var(--gold);color:var(--teal2)}
.alert button{background:#fff;color:var(--ink);border-radius:8px;padding:6px 14px;font-weight:700}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;padding:14px;align-items:start}
.col h3{font-size:19px;margin-bottom:8px;display:flex;justify-content:space-between}
.col .cnt{background:var(--ink);color:#fff;border-radius:999px;padding:0 10px;font-size:15px}
.oc2{background:#fff;border-radius:12px;border-left:8px solid var(--gold);padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.oc2.new{border-left-color:var(--red)}.oc2.ready{border-left-color:var(--green)}
.oc2 .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tn{font-size:44px;font-weight:800;line-height:1}
.tn small{font-size:15px;font-weight:600;color:var(--mute);margin-right:4px}
.meta{text-align:right;color:var(--mute);font-size:14px}
.oc2 ul{list-style:none;padding:0;margin:8px 0}
.oc2 li{padding:2px 0;font-size:17px}
.oc2 li b{display:inline-block;min-width:28px}
.note{background:var(--gold2);border-radius:8px;padding:6px 10px;margin:6px 0;font-size:15px}
.acts{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:8px}
.chipst{display:inline-block;font-size:13px;font-weight:700;padding:1px 10px;border-radius:999px;background:#EEF3F1}
.chipst.claimed{background:var(--gold2)}.chipst.paid{background:#D5EFDD;color:#14532D}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:14px}
.tcard{background:#fff;border-radius:12px;padding:12px;border:2px solid var(--line)}
.tcard.busy{border-color:var(--gold)}.tcard.pay{border-color:var(--green)}
.tcard .amt{font-size:24px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;padding:14px}
.stat{background:#fff;border-radius:12px;padding:14px}
.stat b{display:block;font-size:28px;font-family:'Baloo 2'}
.tbl{width:calc(100% - 28px);margin:0 14px 14px;background:#fff;border-radius:12px;border-collapse:collapse}
.tbl th,.tbl td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}
.login{max-width:340px;margin:12vh auto;background:#fff;border-radius:16px;padding:24px;text-align:center}
.login input{width:100%;font:inherit;font-size:22px;text-align:center;letter-spacing:.3em;border:2px solid var(--line);border-radius:10px;padding:10px;margin:14px 0}

/* qr + home */
.wrap{max-width:900px;margin:0 auto;padding:16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input{flex:1;min-width:220px;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:9px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.qcard{background:#fff;border:2px solid var(--teal);border-radius:16px;padding:16px;text-align:center;break-inside:avoid}
.qcard .brand{color:var(--teal);font-size:18px}
.qcard .tn{font-size:46px;color:var(--teal2)}
.qcard .qr{display:inline-block;margin:6px 0}
.hgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0 20px}
.hgrid a{background:#fff;border:1.5px solid var(--line);border-radius:10px;text-align:center;padding:10px;text-decoration:none;color:var(--ink);font-weight:700}

/* printing */
#slip{display:none}
.sl{width:72mm;font-family:'Courier New',monospace;color:#000;font-size:14px;page-break-after:always}
.sl .sc{text-align:center}.sl .b{font-weight:700;font-size:16px}
.sl .stn{text-align:center;font-size:34px;font-weight:800;margin:4px 0}
.sl .sq{font-size:17px;font-weight:700;padding:2px 0}
.sl .sr{display:flex;justify-content:space-between}
.sl hr{border:0;border-top:1px dashed #000;margin:6px 0}
@page{margin:5mm}
@media print{
  body{background:#fff}
  body:not(.qr) #app{display:none!important}
  body:not(.qr) #slip{display:block}
  body.qr .toolbar{display:none}
  body.qr .qgrid{grid-template-columns:repeat(2,1fr)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="slip"></div>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ==========================================================
   SETTINGS — sirf yahi hissa badalna hai
   ========================================================== */
const CONFIG = {
  NAME: 'Vrindavan Food Enterprise',
  TABLES: 10,
  COUNTER_PIN: '1234',            // counter kholne ka PIN — badal lena
  UPI_ID: '',                     // apna UPI ID likho, jaise 'vrindavan@upi'. Khali = online option band
  UPI_NAME: 'Vrindavan Food Enterprise',
  SUPABASE_URL: '',               // Supabase se milega (SETUP.md dekho)
  SUPABASE_KEY: '',               // Supabase "anon public" key
  MENU: [
    { cat: 'Starters', items: [
      { id: 's1', name: 'Paneer Tikka', price: 220, desc: 'Tandoor-grilled paneer, mint chutney' },
      { id: 's2', name: 'Hara Bhara Kebab', price: 180, desc: 'Spinach and green pea patties' },
      { id: 's3', name: 'Veg Spring Roll', price: 140, desc: '6 pieces, sweet chilli sauce' },
      { id: 's4', name: 'Crispy Corn', price: 160, desc: 'Fried sweet corn with spices' }
    ]},
    { cat: 'Main Course', items: [
      { id: 'm1', name: 'Shahi Paneer', price: 240, desc: 'Rich creamy tomato gravy' },
      { id: 'm2', name: 'Kadhai Paneer', price: 240, desc: 'Capsicum, onion, kadhai masala' },
      { id: 'm3', name: 'Dal Makhani', price: 200, desc: 'Slow-cooked black dal with butter' },
      { id: 'm4', name: 'Mix Veg', price: 180, desc: 'Seasonal vegetables' },
      { id: 'm5', name: 'Chole Masala', price: 170, desc: 'Spiced chickpeas' }
    ]},
    { cat: 'Breads & Rice', items: [
      { id: 'b1', name: 'Tandoori Roti', price: 20 },
      { id: 'b2', name: 'Butter Naan', price: 45 },
      { id: 'b3', name: 'Laccha Paratha', price: 50 },
      { id: 'b4', name: 'Jeera Rice', price: 120 },
      { id: 'b5', name: 'Veg Biryani', price: 190, desc: 'Served with raita' }
    ]},
    { cat: 'Drinks', items: [
      { id: 'd1', name: 'Masala Chai', price: 20 },
      { id: 'd2', name: 'Sweet Lassi', price: 70 },
      { id: 'd3', name: 'Fresh Lime Soda', price: 60 },
      { id: 'd4', name: 'Cold Coffee', price: 90 }
    ]},
    { cat: 'Desserts', items: [
      { id: 'x1', name: 'Gulab Jamun (2 pc)', price: 60 },
      { id: 'x2', name: 'Kulfi', price: 80 },
      { id: 'x3', name: 'Rasmalai (2 pc)', price: 90 }
    ]}
  ]
};
/* item mein veg:false likho to non-veg dot dikhega. available:false likho to "Not available today" dikhega. */

/* ==========================================================
   Helpers
   ========================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rupee = n => '₹' + Number(n).toLocaleString('en-IN');
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(16).slice(2);
const tm = iso => new Date(iso).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
const ago = iso => { const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000)); return m < 1 ? 'just now' : m + ' min ago'; };
const sameDay = iso => new Date(iso).toDateString() === new Date().toDateString();
const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);
const byTime = (a, b) => new Date(a.created_at) - new Date(b.created_at);

let toastTimer;
function toast(msg, err) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = '', 2600);
}

const ls = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* ==========================================================
   Data layer: Supabase (live) ya Demo (sirf isi browser mein)
   ========================================================== */
const DEMO = !(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY && window.supabase);
const sb = DEMO ? null : window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
const mem = { orders: [], calls: [] };
const dRead = k => ls.get('vfe_' + k) || mem[k];
const dWrite = (k, v) => { mem[k] = v; ls.set('vfe_' + k, v); };

const store = {
  async load(tableNo) {
    if (DEMO) {
      const f = tableNo ? x => x.table_no === tableNo : () => true;
      return { orders: dRead('orders').filter(f), calls: dRead('calls').filter(f) };
    }
    const since = new Date(Date.now() - 2 * 864e5).toISOString();
    let qo = sb.from('orders').select('*').gte('created_at', since).order('created_at');
    let qc = sb.from('calls').select('*').gte('created_at', since).order('created_at');
    if (tableNo) { qo = qo.eq('table_no', tableNo); qc = qc.eq('table_no', tableNo); }
    const [o, c] = await Promise.all([qo, qc]);
    if (o.error || c.error) throw (o.error || c.error);
    return { orders: o.data, calls: c.data };
  },
  async addOrder(o) {
    if (DEMO) {
      const list = dRead('orders').slice();
      const row = { ...o, id: uid(), num: list.reduce((m, x) => Math.max(m, x.num), 0) + 1, status: 'new', pay_status: 'unpaid', pay_method: null, created_at: new Date().toISOString() };
      list.push(row); dWrite('orders', list); return row;
    }
    const { data, error } = await sb.from('orders').insert(o).select().single();
    if (error) throw error; return data;
  },
  async patchOrders(ids, patch) {
    if (!ids.length) return;
    if (DEMO) { dWrite('orders', dRead('orders').map(x => ids.includes(x.id) ? { ...x, ...patch } : x)); return; }
    const { error } = await sb.from('orders').update(patch).in('id', ids);
    if (error) throw error;
  },
  async addCall(c) {
    if (DEMO) {
      const list = dRead('calls').slice();
      list.push({ ...c, id: uid(), done: false, created_at: new Date().toISOString() });
      dWrite('calls', list); return;
    }
    const { error } = await sb.from('calls').insert(c);
    if (error) throw error;
  },
  async patchCalls(ids, patch) {
    if (!ids.length) return;
    if (DEMO) { dWrite('calls', dRead('calls').map(x => ids.includes(x.id) ? { ...x, ...patch } : x)); return; }
    const { error } = await sb.from('calls').update(patch).in('id', ids);
    if (error) throw error;
  }
};

function startSync(fn) {
  let busy = false;
  const run = async () => {
    if (busy) return; busy = true;
    try { await fn(); } catch (e) { console.error(e); } finally { busy = false; }
  };
  if (DEMO) window.addEventListener('storage', run);
  else sb.channel('vfe-live').on('postgres_changes', { event: '*', schema: 'public' }, run).subscribe();
  setInterval(run, 4000);   // backup: har 4 second mein bhi check
  return run;
}

/* click handling: har button mein data-act aur data-v */
let H = {};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || !H[t.dataset.act]) return;
  Promise.resolve(H[t.dataset.act](t.dataset.v, t)).catch(err => { console.error(err); toast('Something went wrong. Please try again.', true); });
});

const demoBar = () => DEMO ? '<div class="demo">Demo mode: data sirf isi browser mein save ho raha hai. Live karne ke liye SETUP.md dekho.</div>' : '';

/* ==========================================================
   Printing
   ========================================================== */
function printHtml(html) { $('#slip').innerHTML = html; window.print(); }
function slipOrder(o) {
  return `<div class="sl"><div class="sc b">${esc(CONFIG.NAME)}</div><div class="stn">TABLE ${o.table_no}</div>
  <div class="sc">Order #${o.num} &nbsp; ${tm(o.created_at)}</div><hr>
  ${o.items.map(i => `<div class="sq">${i.qty} x ${esc(i.name)}</div>`).join('')}
  ${o.note ? `<hr><div class="sq">Note: ${esc(o.note)}</div>` : ''}<hr>
  <div class="sc">Serve at Table ${o.table_no}</div></div>`;
}
function slipBill(t, orders) {
  const m = {};
  orders.forEach(o => o.items.forEach(i => { m[i.id] = m[i.id] || { ...i, qty: 0 }; m[i.id].qty += i.qty; }));
  const lines = Object.values(m), total = sum(lines, i => i.price * i.qty);
  return `<div class="sl"><div class="sc b">${esc(CONFIG.NAME)}</div><div class="stn">TABLE ${t}</div>
  <div class="sc">${new Date().toLocaleString('en-IN')}</div><hr>
  ${lines.map(i => `<div class="sr"><span>${i.qty} x ${esc(i.name)}</span><span>${i.price * i.qty}</span></div>`).join('')}
  <hr><div class="sr"><b>TOTAL</b><b>Rs ${total}</b></div><hr><div class="sc">Thank you! Visit again.</div></div>`;
}

/* ==========================================================
   CUSTOMER  (?table=5)
   ========================================================== */
function customerView(tableNo) {
  document.title = CONFIG.NAME + ' · Table ' + tableNo;
  const items = {};
  CONFIG.MENU.forEach(c => c.items.forEach(i => items[i.id] = i));
  const S = { cat: CONFIG.MENU[0].cat, tab: 'menu', cart: {}, note: '', sheet: false, sending: false, orders: [], calls: [], sig: '' };
  const cnt = () => sum(Object.values(S.cart), q => q);
  const total = () => sum(Object.entries(S.cart), ([id, q]) => items[id].price * q);

  $('#app').innerHTML = `<div class="cust">${demoBar()}
    <header class="top"><div><div class="brand">${esc(CONFIG.NAME)}</div><div class="sub">आपका स्वागत है</div></div>
      <div class="tbadge"><small>Table</small><b>${tableNo}</b></div></header>
    <div class="bar">
      <button class="tab on" data-act="tab" data-v="menu" id="t-menu">Menu</button>
      <button class="tab" data-act="tab" data-v="orders" id="t-orders">My orders &amp; bill<span id="ob"></span></button>
      <button class="callw" data-act="waiter" id="waiter">Call waiter</button>
    </div>
    <section id="v-menu"><div class="chips" id="chips"></div><ul class="menu" id="list"></ul></section>
    <section id="v-orders" hidden></section>
    <div id="cartbar"></div><div id="sheet"></div></div>`;

  const renderChips = () => $('#chips').innerHTML = CONFIG.MENU.map(c =>
    `<button class="chip ${c.cat === S.cat ? 'on' : ''}" data-act="cat" data-v="${esc(c.cat)}">${esc(c.cat)}</button>`).join('');
  const stepper = (id, q) => `<div class="step"><button data-act="sub" data-v="${id}" aria-label="Remove one">−</button><span>${q}</span><button data-act="add" data-v="${id}" aria-label="Add one">+</button></div>`;
  const renderList = () => {
    const cat = CONFIG.MENU.find(c => c.cat === S.cat);
    $('#list').innerHTML = cat.items.map(i => {
      const q = S.cart[i.id] || 0;
      const ctl = i.available === false ? '<span class="na">Not available today</span>' : q ? stepper(i.id, q) : `<button class="add" data-act="add" data-v="${i.id}">Add</button>`;
      return `<li class="item"><div><div class="nm"><span class="dot ${i.veg === false ? 'nv' : ''}"></span>${esc(i.name)}</div>${i.desc ? `<div class="ds">${esc(i.desc)}</div>` : ''}<div class="pr">${rupee(i.price)}</div></div><div class="ctl">${ctl}</div></li>`;
    }).join('');
  };
  const renderBar = () => {
    $('#cartbar').innerHTML = (S.tab === 'menu' && cnt()) ? `<div class="cb"><div><b>${rupee(total())}</b><div class="sub">${cnt()} item${cnt() > 1 ? 's' : ''} added</div></div><button class="btn gold" data-act="opencart">View order</button></div>` : '';
  };
  const renderSheet = () => {
    const el = $('#sheet');
    if (!S.sheet) { el.innerHTML = ''; return; }
    const lines = Object.entries(S.cart).map(([id, q]) => { const i = items[id]; return `<div class="ln"><div><div class="nm">${esc(i.name)}</div><div class="ds">${rupee(i.price)} each</div></div>${stepper(id, q)}<div class="lt">${rupee(i.price * q)}</div></div>`; }).join('');
    el.innerHTML = `<div class="scrim" data-act="closecart"></div><div class="sheet" role="dialog" aria-label="Your order">
      <div class="sh-h"><h2>Your order · Table ${tableNo}</h2><button data-act="closecart" aria-label="Close">✕</button></div>
      <div class="sh-b">${lines}<label class="fl">Note for kitchen (optional)<textarea id="note" rows="2" maxlength="140" placeholder="e.g. less spicy, no onion">${esc(S.note)}</textarea></label></div>
      <div class="sh-f"><div class="tot"><span>Total</span><b>${rupee(total())}</b></div><button class="btn gold" data-act="place" ${S.sending ? 'disabled' : ''}>${S.sending ? 'Sending…' : 'Send order to kitchen'}</button></div></div>`;
  };
  const refreshCart = () => { renderList(); renderBar(); renderSheet(); };
  const showTab = () => {
    $('#v-menu').hidden = S.tab !== 'menu'; $('#v-orders').hidden = S.tab !== 'orders';
    $('#t-menu').classList.toggle('on', S.tab === 'menu'); $('#t-orders').classList.toggle('on', S.tab === 'orders');
    renderBar(); if (S.tab === 'orders') renderOrders(true);
  };

  const upiLink = amt => `upi://pay?pa=${encodeURIComponent(CONFIG.UPI_ID)}&pn=${encodeURIComponent(CONFIG.UPI_NAME)}&am=${amt}&cu=INR&tn=${encodeURIComponent('Table ' + tableNo)}`;
  const stages = ['new', 'cooking', 'ready', 'served'], stageName = ['Received', 'Cooking', 'Ready', 'Served'];

  function renderOrders(force) {
    const mine = S.orders.filter(o => Date.now() - new Date(o.created_at) < 12 * 36e5).sort(byTime);
    const unpaid = mine.filter(o => o.pay_status !== 'paid');
    const sig = JSON.stringify(unpaid) + mine.length;
    $('#ob').textContent = unpaid.length ? ' (' + unpaid.length + ')' : '';
    if (S.tab !== 'orders' || (!force && sig === S.sig)) return;
    S.sig = sig;
    const el = $('#v-orders');
    if (!unpaid.length) {
      const last = mine[mine.length - 1];
      el.innerHTML = (last && Date.now() - new Date(last.created_at) < 90 * 6e4)
        ? `<div class="msg"><b>Payment received. Thank you!</b><br>Order again anytime from the Menu tab.</div>`
        : `<div class="empty">No orders yet.<br>Pick something from the menu.<br><button class="btn gold" data-act="tab" data-v="menu">Open menu</button></div>`;
      return;
    }
    const amt = sum(unpaid, o => o.total);
    const allSet = unpaid.every(o => o.pay_method);
    const method = allSet ? unpaid[0].pay_method : null;
    const claimed = allSet && unpaid.every(o => o.pay_status === 'claimed');
    const onlineOK = !!CONFIG.UPI_ID;
    let pay = '';
    if (claimed) {
      pay = `<div class="pay"><h3><span>Bill</span><span>${rupee(amt)}</span></h3><p>Thank you! The counter is confirming your payment.</p></div>`;
    } else if (method === 'cash') {
      pay = `<div class="pay"><h3><span>Bill</span><span>${rupee(amt)}</span></h3><p>Please pay <b>${rupee(amt)} in cash</b> at the counter. Staff has been told.</p><div class="row"><button class="btn line" data-act="changepay">Change method</button></div></div>`;
    } else if (method === 'online') {
      pay = `<div class="pay"><h3><span>Pay online</span><span>${rupee(amt)}</span></h3><div class="upi"><div id="upiqr"></div><p class="ds">Scan with any UPI app and pay ${rupee(amt)}</p><a class="btn teal sm" href="${upiLink(amt)}">Open UPI app</a></div><div class="row"><button class="btn gold" data-act="paid">I have paid</button><button class="btn line" data-act="changepay">Change method</button></div></div>`;
    } else {
      pay = `<div class="pay"><h3><span>Bill so far</span><span>${rupee(amt)}</span></h3><p class="ds">Want something more? Order again from the Menu tab. When you are done, choose how to pay.</p><div class="row"><button class="btn teal" data-act="paycash">Pay cash</button>${onlineOK ? '<button class="btn teal" data-act="payonline">Pay online</button>' : ''}</div></div>`;
    }
    el.innerHTML = unpaid.map(o => {
      const idx = Math.max(0, stages.indexOf(o.status));
      return `<div class="oc"><h3><span>Order #${o.num}</span><span class="mute">${tm(o.created_at)}</span></h3>
        <ol class="prog">${stageName.map((n, i) => `<li class="${i <= idx ? 'done' : ''}">${n}</li>`).join('')}</ol>
        ${o.items.map(i => `<div class="li"><span>${i.qty} × ${esc(i.name)}</span><span>${rupee(i.price * i.qty)}</span></div>`).join('')}
        ${o.note ? `<div class="ds">Note: ${esc(o.note)}</div>` : ''}</div>`;
    }).join('') + pay;
    if (method === 'online' && !claimed && window.QRCode) new QRCode($('#upiqr'), { text: upiLink(amt), width: 190, height: 190 });
  }

  const unpaidNow = () => S.orders.filter(o => o.pay_status !== 'paid' && Date.now() - new Date(o.created_at) < 12 * 36e5);
  const sync = startSync(async () => {
    const d = await store.load(tableNo);
    S.orders = d.orders; S.calls = d.calls;
    const w = S.calls.some(c => c.kind === 'waiter' && !c.done);
    const b = $('#waiter'); b.disabled = w; b.textContent = w ? 'Waiter is coming' : 'Call waiter';
    renderOrders(false);
  });

  H = {
    cat: v => { S.cat = v; renderChips(); renderList(); },
    tab: v => { S.tab = v; showTab(); window.scrollTo(0, 0); },
    add: v => { S.cart[v] = (S.cart[v] || 0) + 1; refreshCart(); },
    sub: v => { if (S.cart[v] > 1) S.cart[v]--; else delete S.cart[v]; if (!cnt()) S.sheet = false; refreshCart(); },
    opencart: () => { S.sheet = true; renderSheet(); },
    closecart: () => { S.sheet = false; renderSheet(); },
    place: async () => {
      if (S.sending || !cnt()) return;
      S.sending = true; renderSheet();
      try {
        const lines = Object.entries(S.cart).map(([id, q]) => ({ id, name: items[id].name, price: items[id].price, qty: q }));
        await store.addOrder({ table_no: tableNo, items: lines, total: total(), note: S.note.trim() || null });
        S.cart = {}; S.note = ''; S.sheet = false; S.tab = 'orders';
        toast('Order sent to the kitchen');
      } catch (e) { console.error(e); toast('Could not send the order. Check your internet and try again.', true); }
      S.sending = false; refreshCart(); showTab(); await sync();
    },
    waiter: async () => { await store.addCall({ table_no: tableNo, kind: 'waiter', note: null }); toast('Waiter has been called'); await sync(); },
    paycash: async () => {
      const u = unpaidNow(), amt = sum(u, o => o.total);
      await store.patchOrders(u.map(o => o.id), { pay_method: 'cash' });
      await store.addCall({ table_no: tableNo, kind: 'bill', note: `Wants to pay ${rupee(amt)} in cash` });
      toast('Counter has been told'); await sync(); renderOrders(true);
    },
    payonline: async () => { await store.patchOrders(unpaidNow().map(o => o.id), { pay_method: 'online' }); await sync(); renderOrders(true); },
    paid: async () => {
      const u = unpaidNow(), amt = sum(u, o => o.total);
      await store.patchOrders(u.map(o => o.id), { pay_status: 'claimed' });
      await store.addCall({ table_no: tableNo, kind: 'bill', note: `Says paid ${rupee(amt)} online. Please check and confirm` });
      toast('Thank you!'); await sync(); renderOrders(true);
    },
    changepay: async () => { await store.patchOrders(unpaidNow().map(o => o.id), { pay_method: null, pay_status: 'unpaid' }); await sync(); renderOrders(true); }
  };
  document.addEventListener('input', e => { if (e.target.id === 'note') S.note = e.target.value; });

  renderChips(); refreshCart(); sync();
}

/* ==========================================================
   COUNTER  (?counter)
   ========================================================== */
let actx;
function beep() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    [880, 1175, 880].forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.2;
      o.frequency.value = f; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.4, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.start(t); o.stop(t + 0.2);
    });
  } catch (e) {}
}

function counterView() {
  document.title = 'Counter · ' + CONFIG.NAME;
  if (ls.get('vfe_auth') !== CONFIG.COUNTER_PIN) {
    $('#app').innerHTML = `${demoBar()}<div class="login"><h1 class="brand">${esc(CONFIG.NAME)}</h1><p class="mute">Counter login</p>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN" placeholder="PIN">
      <button class="btn teal" data-act="login">Open counter</button></div>`;
    const go = () => { if ($('#pin').value === CONFIG.COUNTER_PIN) { ls.set('vfe_auth', CONFIG.COUNTER_PIN); beep(); counterView(); } else toast('Wrong PIN', true); };
    H = { login: go };
    $('#pin').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    return;
  }
  const C = { tab: 'orders', orders: [], calls: [], seen: null, seenC: null, sound: true, auto: ls.get('vfe_autoprint') === true };
  const nextOf = { new: ['cooking', 'Start cooking'], cooking: ['ready', 'Mark ready'], ready: ['served', 'Mark served'] };
  const payChip = o => `<span class="chipst ${o.pay_status}">${o.pay_status === 'paid' ? 'Paid' : o.pay_status === 'claimed' ? 'Says paid (online)' : o.pay_method === 'cash' ? 'Will pay cash' : o.pay_method === 'online' ? 'Paying online' : 'Unpaid'}</span>`;

  function orderCard(o) {
    return `<div class="oc2 ${o.status}"><div class="hd"><div class="tn"><small>Table</small>${o.table_no}</div><div class="meta">Order #${o.num}<br>${tm(o.created_at)} · ${ago(o.created_at)}</div></div>
      <ul>${o.items.map(i => `<li><b>${i.qty}×</b> ${esc(i.name)}</li>`).join('')}</ul>
      ${o.note ? `<div class="note">Note: ${esc(o.note)}</div>` : ''}
      <div>${rupee(o.total)} ${payChip(o)}</div>
      <div class="acts"><button class="btn line sm" data-act="print" data-v="${o.id}">Print slip</button><button class="btn teal sm" data-act="next" data-v="${o.id}">${nextOf[o.status][1]}</button></div></div>`;
  }

  function render() {
    const calls = C.calls.filter(c => !c.done).sort(byTime);
    const active = C.orders.filter(o => o.status !== 'served').sort(byTime);
    const nNew = active.filter(o => o.status === 'new').length;
    document.title = ((nNew + calls.length) ? `(${nNew + calls.length}) ` : '') + 'Counter · ' + CONFIG.NAME;
    let body = '';
    if (C.tab === 'orders') {
      const col = (st, title) => { const l = active.filter(o => o.status === st); return `<div class="col"><h3>${title}<span class="cnt">${l.length}</span></h3>${l.map(orderCard).join('') || '<p class="mute">Nothing here</p>'}</div>`; };
      body = `<div class="cols">${col('new', 'New')}${col('cooking', 'Cooking')}${col('ready', 'Ready to serve')}</div>`;
    } else if (C.tab === 'tables') {
      let cards = '';
      for (let t = 1; t <= CONFIG.TABLES; t++) {
        const u = C.orders.filter(o => o.table_no === t && o.pay_status !== 'paid');
        const amt = sum(u, o => o.total), wants = C.calls.some(c => c.table_no === t && c.kind === 'bill' && !c.done);
        const how = !u.length ? '' : u.every(o => o.pay_status === 'claimed') ? 'Says paid online. Check your UPI app.' : u.every(o => o.pay_method === 'cash') ? 'Will pay cash' : u.every(o => o.pay_method === 'online') ? 'Paying online' : 'Still eating';
        cards += `<div class="tcard ${u.length ? (wants ? 'pay' : 'busy') : ''}"><div class="tn"><small>Table</small>${t}</div>
          ${u.length ? `<div class="amt">${rupee(amt)}</div><div class="ds">${how}</div>
          <div class="acts"><button class="btn line sm" data-act="bill" data-v="${t}">Print bill</button><button class="btn teal sm" data-act="paid" data-v="${t}">Mark paid</button></div>` : '<div class="mute">Free</div>'}</div>`;
      }
      body = `<div class="tgrid">${cards}</div>`;
    } else {
      const today = C.orders.filter(o => sameDay(o.created_at)), paid = today.filter(o => o.pay_status === 'paid');
      const cash = sum(paid.filter(o => o.pay_method === 'cash'), o => o.total), online = sum(paid.filter(o => o.pay_method !== 'cash'), o => o.total);
      body = `<div class="stats"><div class="stat">Sales received<b>${rupee(cash + online)}</b></div><div class="stat">Cash<b>${rupee(cash)}</b></div><div class="stat">Online<b>${rupee(online)}</b></div><div class="stat">Orders today<b>${today.length}</b></div><div class="stat">Not paid yet<b>${rupee(sum(today.filter(o => o.pay_status !== 'paid'), o => o.total))}</b></div></div>
        <table class="tbl"><tr><th>Time</th><th>Table</th><th>Order</th><th>Amount</th><th>Payment</th></tr>${today.slice().sort((a, b) => byTime(b, a)).map(o => `<tr><td>${tm(o.created_at)}</td><td>${o.table_no}</td><td>#${o.num}</td><td>${rupee(o.total)}</td><td>${payChip(o)}</td></tr>`).join('') || '<tr><td colspan="5" class="mute">No orders today</td></tr>'}</table>`;
    }
    $('#app').innerHTML = `${demoBar()}<div class="cn-top"><span class="brand">${esc(CONFIG.NAME)}</span>
      ${['orders', 'tables', 'today'].map(t => `<button class="tab ${C.tab === t ? 'on' : ''}" data-act="ctab" data-v="${t}">${{ orders: 'Orders', tables: 'Tables & bills', today: 'Today' }[t]}</button>`).join('')}
      <div class="sp"><button class="sbtn" data-act="sound">Sound: ${C.sound ? 'On' : 'Off'}</button><label><input type="checkbox" data-act="auto" ${C.auto ? 'checked' : ''}> Auto-print new orders</label><button class="sbtn" data-act="logout">Log out</button></div></div>
      ${calls.length ? `<div class="alerts">${calls.map(c => `<div class="alert ${c.kind}"><span>Table ${c.table_no}: ${c.kind === 'waiter' ? 'needs the waiter' : esc(c.note || 'wants to pay')}</span><button data-act="calldone" data-v="${c.id}">Done</button></div>`).join('')}</div>` : ''}${body}`;
  }

  const sync = startSync(async () => {
    const d = await store.load();
    if (C.seen) {
      const nu = d.orders.filter(o => !C.seen.has(o.id)), nc = d.calls.filter(c => !C.seenC.has(c.id) && !c.done);
      if ((nu.length || nc.length) && C.sound) beep();
      if (nu.length && C.auto) printHtml(nu.map(slipOrder).join(''));
    }
    C.seen = new Set(d.orders.map(o => o.id)); C.seenC = new Set(d.calls.map(c => c.id));
    C.orders = d.orders; C.calls = d.calls; render();
  });

  H = {
    ctab: v => { C.tab = v; render(); },
    sound: () => { C.sound = !C.sound; if (C.sound) beep(); render(); },
    auto: (v, el) => { C.auto = el.checked; ls.set('vfe_autoprint', C.auto); },
    logout: () => { ls.set('vfe_auth', ''); counterView(); },
    print: v => printHtml(slipOrder(C.orders.find(o => o.id === v))),
    next: async v => { const o = C.orders.find(x => x.id === v); await store.patchOrders([v], { status: nextOf[o.status][0] }); await sync(); },
    calldone: async v => { await store.patchCalls([v], { done: true }); await sync(); },
    bill: v => printHtml(slipBill(v, C.orders.filter(o => o.table_no === +v && o.pay_status !== 'paid'))),
    paid: async v => {
      const t = +v, u = C.orders.filter(o => o.table_no === t && o.pay_status !== 'paid');
      await store.patchOrders(u.map(o => o.id), { pay_status: 'paid', pay_method: u[0].pay_method || 'cash' });
      await store.patchCalls(C.calls.filter(c => c.table_no === t && c.kind === 'bill' && !c.done).map(c => c.id), { done: true });
      toast('Table ' + t + ' marked paid'); await sync();
    }
  };
  render(); sync();
}

/* ==========================================================
   QR PAGE (?qr) — har table ka QR chhapne ke liye
   ========================================================== */
function qrView() {
  document.body.classList.add('qr');
  document.title = 'Table QR codes · ' + CONFIG.NAME;
  const base = location.href.split('#')[0].split('?')[0];
  $('#app').innerHTML = `<div class="wrap"><div class="toolbar">
    <input id="base" value="${esc(base)}" aria-label="Website link">
    <button class="btn teal sm" data-act="regen">Update QR codes</button><button class="btn gold sm" data-act="prt">Print all</button></div>
    <p class="mute toolbar">Website live hone ke baad yahi page uske asli link par kholo (jaise https://naam.pages.dev/?qr), tab QR print karo. Galat link ka QR kaam nahi karega.</p>
    <div class="qgrid" id="qg"></div></div>`;
  function gen() {
    const b = $('#base').value.trim().split('?')[0];
    $('#qg').innerHTML = Array.from({ length: CONFIG.TABLES }, (_, i) => `<div class="qcard"><div class="brand">${esc(CONFIG.NAME)}</div><div class="tn"><small class="mute" style="font-size:16px">Table </small>${i + 1}</div><div class="qr" id="q${i + 1}"></div><div>Scan to see the menu and order</div></div>`).join('');
    if (window.QRCode) for (let i = 1; i <= CONFIG.TABLES; i++) new QRCode($('#q' + i), { text: b + '?table=' + i, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M });
    else $('#qg').insertAdjacentHTML('afterbegin', '<p>QR library load nahi hui. Internet check karo.</p>');
  }
  H = { regen: gen, prt: () => window.print() };
  gen();
}

/* ==========================================================
   Home (owner ke liye) + router
   ========================================================== */
function homeView(msg) {
  document.title = CONFIG.NAME;
  $('#app').innerHTML = `${demoBar()}<div class="wrap"><h1 class="brand" style="font-size:30px;color:var(--teal)">${esc(CONFIG.NAME)}</h1>
    ${msg ? `<p>${esc(msg)}</p>` : '<p class="mute">Owner page. Customers seedha apne table ka QR scan karte hain.</p>'}
    <h3 style="margin-top:20px">Staff</h3><p style="margin:8px 0 16px"><a class="btn teal sm" href="?counter">Open counter</a> <a class="btn line sm" href="?qr">Print table QR codes</a></p>
    <h3>Try the customer screen</h3><div class="hgrid">${Array.from({ length: CONFIG.TABLES }, (_, i) => `<a href="?table=${i + 1}">Table ${i + 1}</a>`).join('')}</div></div>`;
}

(function () {
  const p = new URLSearchParams(location.search), t = parseInt(p.get('table'), 10);
  if (p.has('qr')) qrView();
  else if (p.has('counter')) counterView();
  else if (t >= 1 && t <= CONFIG.TABLES) customerView(t);
  else if (p.has('table')) homeView('This table number is not valid. Please scan the QR code on your table.');
  else homeView();
})();
</script>
